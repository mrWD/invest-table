<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InvestTable">
  <!--
    Таблица, из которой растёт кривая — ровно то, чем приложение является.

    Три толстые полосы, а не шесть тонких: на 60px, в котором иконка живёт на домашнем
    экране, тонкие сливались в пятно. Фон #1f2430, а не почти чёрный, иначе плитка
    растворяется на тёмных обоях.
  -->
  <rect width="512" height="512" rx="112" fill="#1f2430"/>
  <g fill="#eb6834">
    <rect x="104" y="330" width="86" height="30" rx="15"/>
    <rect x="104" y="382" width="150" height="30" rx="15"/>
    <rect x="104" y="434" width="214" height="30" rx="15"/>
  </g>
  <path d="M104 268 C 208 262, 292 214, 396 108" fill="none" stroke="#3987e5"
        stroke-width="34" stroke-linecap="round"/>
  <circle cx="396" cy="108" r="30" fill="#3987e5"/>
</svg>
